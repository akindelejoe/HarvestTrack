# HarvestTrack — full stack: PostgreSQL + Express API + React (nginx)
#   cp .env.example .env   # then set POSTGRES_PASSWORD and JWT_SECRET
#   docker compose up --build
#   open http://localhost:8080

name: harvesttrack

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harvesttrack}
      POSTGRES_USER: ${POSTGRES_USER:-harvest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - harvesttrack_postgres_data:/var/lib/postgresql/data
    # Published on a non-default host port for GUI tools (psql, TablePlus…). Remove to keep it internal-only.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4100
      # Service name "postgres", not localhost — containers talk over the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-harvest}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-harvesttrack}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-72}
      CLIENT_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
      # The stack is served over plain HTTP locally; set true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_CACHE_MINUTES: ${WEATHER_CACHE_MINUTES:-30}
      ALERT_SCAN_INTERVAL_MINUTES: ${ALERT_SCAN_INTERVAL_MINUTES:-180}
      SMS_ENABLED: ${SMS_ENABLED:-true}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    expose:
      - "4100"

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: backend:4100
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  harvesttrack_postgres_data:
    name: harvesttrack_postgres_data
