<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HarvestTrack — crop lifecycle tracking, harvest forecasting and weather-risk alerts for growers." />
    <meta name="theme-color" content="#18191C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HarvestTrack</title>
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('ht-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
